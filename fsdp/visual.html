<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual</title>
    <style>
        :root {
            --bg: #fff;
            --fg: #222;
            --muted: #666;
            --border: #ddd;
            --accent: #2a7de1;
            --input-bg: #fff;
            --input-border: #ccc;
            --record-bg: #f8f8f8;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --fg: #eee;
                --muted: #999;
                --border: #444;
                --accent: #5b9dff;
                --input-bg: #2a2a2a;
                --input-border: #555;
                --record-bg: #222;
            }
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: var(--bg);
            color: var(--fg);
        }
        .search-box {
            margin-bottom: 16px;
        }
        .search-box input[type="text"] {
            width: 400px;
            padding: 6px 10px;
            font-size: 13px;
            background: var(--input-bg);
            color: var(--fg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            box-sizing: border-box;
        }
        .search-box input[type="button"] {
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            background: var(--input-bg);
            color: var(--fg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            margin-left: 6px;
        }
        .search-box input[type="button"]:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .record-info {
            max-width: 600px;
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 5px;
            background: var(--record-bg);
        }
        .record-info h2 {
            margin-bottom: 15px;
            color: var(--accent);
        }
        .record-info .field {
            margin-bottom: 10px;
        }
        .record-info .label {
            font-weight: bold;
            color: var(--fg);
        }
        .record-info .value {
            color: var(--fg);
            word-break: break-all;
        }
        .position-info {
            margin-bottom: 15px;
            color: var(--muted);
            font-size: 14px;
        }
        .nav-buttons input[type="button"] {
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            background: var(--input-bg);
            color: var(--fg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            margin-right: 4px;
        }
        .nav-buttons input[type="button"]:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .nav-buttons input[type="button"]:disabled {
            background: var(--bg);
            color: var(--muted);
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="search-box">
    <input type="text" id="search_input" placeholder="Поиск по URL, имени, пути к файлу..."/>
    <input type="button" id="search_btn" value="Найти"/>
    <input type="button" id="search_clear" value="Сбросить"/>
</div>

<div class="nav-buttons">
    <input type="button" class="prev-button" value="← prev"/>
    <input type="button" class="open_file" value="open file"/>
    <input type="button" class="open_sl" value="open URL"/>
    <input type="button" class="next-button" value="next →"/>
</div>

<div class="position-info"></div>

<div class="record-info">
    <h2>Информация о записи</h2>

    <div class="field">
        <span class="label">URL источника:</span>
        <span class="value" data-field="url_s"></span>
    </div>
    <div class="field">
        <span class="label">Имя файла/записи:</span>
        <span class="value" data-field="name"></span>
    </div>
    <div class="field">
        <span class="label">Дата последнего обновления:</span>
        <span class="value" data-field="date_upd"></span>
    </div>
    <div class="field">
        <span class="label">Статус записи:</span>
        <span class="value" data-field="s_status"></span>
    </div>
    <div class="field">
        <span class="label">Статус попытки:</span>
        <span class="value" data-field="s_att"></span>
    </div>
    <div class="field">
        <span class="label">Последняя проверка:</span>
        <span class="value" data-field="t_att"></span>
    </div>
    <div class="field">
        <span class="label">URL для скачивания:</span>
        <span class="value" data-field="url_fh"></span>
    </div>
    <div class="field">
        <span class="label">Путь к файлу:</span>
        <span class="value" data-field="file_p"></span>
    </div>
    <div class="field">
        <span class="label">Идентификатор файла:</span>
        <span class="value" data-field="id_f"></span>
    </div>
</div>

<script type="module" src="visual.js"></script>
</body>
</html>
